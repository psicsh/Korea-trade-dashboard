name: Update MOTIR trade data

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Re-parse latest month (for corrections)"
        required: false
        default: "false"
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install updater dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4 pypdf openpyxl

      - name: Try to fetch official MTI-HSK mapping
        run: python scripts/fetch_mti_mapping.py
        continue-on-error: true

      - name: Update MOTIR monthly data
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            python scripts/update_motir.py --force
          else
            python scripts/update_motir.py
          fi

      - name: Commit changed data
        run: |
          if git diff --quiet; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "korea-trade-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "Auto-update MOTIR trade data"
          git push
