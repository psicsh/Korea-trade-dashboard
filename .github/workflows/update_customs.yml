name: Update Customs trade data

on:
  workflow_dispatch:
  schedule:
    # 매월 15~22일 13:20 KST. 관세청 전월 현행화 시점 주변에서 자동 재시도.
    - cron: "20 4 15-22 * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests openpyxl

      - name: Update Customs snapshots
        run: python scripts/update_customs.py

      - name: Commit changed snapshots
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "korea-trade-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/trade_monthly.csv data/trade_industry.csv data/trade_region.csv data/customs_update_status.json
          git commit -m "Auto-update Customs trade data"
          git push
